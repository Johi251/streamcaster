name = "streamcaster-proxy"
main = "src/index.ts"
compatibility_date = "2024-10-01"

# Stateless CORS/media proxy. No DO, no KV.
# Routes:
#   /fetch?url=  — CORS relay for HTML/JSON probes (extraction), 2 MB cap
#   /hls?url=    — m3u8 manifest with URIs rewritten to this proxy, 1 MB cap
#   /seg?url=    — pure pass-through stream (Range forwarding, ~0 CPU)
#   /health
