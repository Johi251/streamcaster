<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StreamCast" />
    <title>StreamCaster</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Stream<span>Caster</span></h1>
        <div id="conn-status" class="chip">offline</div>
      </header>
      <main id="view"></main>
      <footer>
        <p class="limit">iPhone: casting &amp; camera work; full screen mirroring needs Android/desktop Chrome. No DRM content (Netflix &amp; Co.).</p>
      </footer>
    </div>
    <input id="hidden-file" type="file" accept="video/*,audio/*" hidden />
    <input id="hidden-sub" type="file" accept=".vtt" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
