<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StreamCast" />
    <title>StreamCaster</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Stream<span>Caster</span></h1>
        <div id="conn-status" class="chip">offline</div>
      </header>
      <main id="view"></main>
      <footer>
        <p class="limit">iPhone: casting &amp; camera work; full screen mirroring needs Android/desktop Chrome. No DRM content (Netflix &amp; Co.).</p>
      </footer>
    </div>
    <input id="hidden-file" type="file" accept="video/*,audio/*" hidden />
    <input id="hidden-sub" type="file" accept=".vtt" hidden />
    <!-- Compatibility guard (plain ES5, runs before the module bundle):
         browsers without ES modules/Promise/fetch/WebSocket used to show a
         white screen. This renders a readable message instead. -->
    <script>
      (function () {
        var missing = [];
        if (typeof Promise === "undefined") missing.push("Promise");
        if (typeof fetch === "undefined") missing.push("fetch");
        if (typeof WebSocket === "undefined") missing.push("WebSocket");
        if (missing.length === 0) return;
        var app = document.getElementById("app");
        if (app) app.style.display = "none";
        var wrap = document.createElement("div");
        wrap.setAttribute("style", "font-family:sans-serif;background:#0b0d12;color:#e8eaf0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px");
        var card = document.createElement("div");
        card.setAttribute("style", "max-width:560px;line-height:1.6");
        var h = document.createElement("h1");
        h.setAttribute("style", "font-size:22px;margin:0 0 12px");
        h.textContent = "StreamCaster";
        var p1 = document.createElement("p");
        p1.setAttribute("style", "margin:0 0 16px");
        p1.textContent = "This browser is too old (missing: " + missing.join(", ") + "). Please use an up-to-date Chrome, Edge, Firefox or Safari.";
        card.appendChild(h);
        card.appendChild(p1);
        wrap.appendChild(card);
        document.body.appendChild(wrap);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
