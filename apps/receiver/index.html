<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0d12" />
    <title>StreamCaster Receiver</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- ═══════════ FULLSCREEN PLAYER ═══════════ -->
      <video
        id="player"
        playsinline
        webkit-playsinline
        aria-label="StreamCaster video player"
      ></video>

      <!-- ═══════════ PLAY/PAUSE TAP OVERLAY ═══════════ -->
      <div id="play-pause-overlay" class="hidden" role="button" tabindex="0" aria-label="Play or Pause">
        <span id="play-pause-icon" class="play-pause-icon">▶</span>
      </div>

      <!-- ═══════════ IDLE SCREEN ═══════════ -->
      <div id="idle" class="idle">
        <div class="idle-card">
          <h1 id="idle-title">📡 StreamCaster</h1>
          <p id="idle-url" class="hint">Open the sender app on your phone —<br>scan the code or type it:</p>

          <!-- Room code & QR -->
          <div id="room-code" class="room-code">······</div>
          <div id="qr-box" class="qr-box hidden"></div>

          <!-- Live connection status -->
          <p id="status" class="status chip" aria-live="polite">
            Waiting for sender…
          </p>

          <!-- Reconnect button -->
          <button id="connect-btn" class="connect">Reconnect</button>
        </div>
      </div>

      <!-- ═══════════ TOAST (created here, shown via .visible) ═══════════ -->
      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <!-- ═══════════ BOTTOM CONTROLS BAR ═══════════ -->
      <div id="controls" class="controls hidden">
        <div class="controls-row">
          <!-- ── Seek bar ── -->
          <div class="seek-container" id="seek-container" role="region" aria-label="Seek bar">
            <span class="seek-time" id="current-pos">0:00</span>
            <input
              id="seek"
              type="range"
              min="0"
              max="100"
              value="0"
              step="0.5"
              aria-label="Seek"
              aria-valuemin="0"
              aria-valuemax="100"
            />
            <span class="seek-time" id="total-duration">0:00</span>
          </div>

          <!-- ── Quick seek buttons (for TV remote) ── -->
          <button
            id="seek-back"
            class="seek-btn"
            aria-label="Seek back 10 seconds"
          >
            ⏩
          </button>
          <button
            id="seek-forward"
            class="seek-btn"
            aria-label="Seek forward 10 seconds"
          >
            ⏪
          </button>

          <!-- ── Volume bar ── -->
          <div id="volume-row" class="volume-row">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M12 2.5a.75.75 0 0 1 .75.75V8H20.25a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0V8.75H17.5V14h2.5a.75.75 0 0 1 0 1.5V19.25a.75.75 0 0 1-.75.75H12.75a.75.75 0 0 1-.75-.75V14h2.5V8.75H17.5V5.5a.75.75 0 0 1-1.5 0V3.25a.75.75 0 0 1-.75-.75z"
              />
            </svg>
            <input
              id="volume"
              type="range"
              min="0"
              max="100"
              value="100"
              aria-label="Volume"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="100"
            />
            <span id="volume-label" class="volume-label">100%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Compatibility guard (plain ES5, runs before the module bundle):
         browsers without module support ignore the module script entirely and
         used to show a white screen. This script parses even on old TV
         browsers (Fire OS 5 Silk, Tizen, webOS) and renders a readable
         fallback that points at the receiver APK instead. -->
    <script>
      (function () {
        var missing = [];
        if (typeof Promise === "undefined") missing.push("Promise");
        if (typeof fetch === "undefined") missing.push("fetch");
        if (typeof WebSocket === "undefined") missing.push("WebSocket");
        if (typeof RTCPeerConnection === "undefined" &&
            typeof webkitRTCPeerConnection === "undefined") missing.push("WebRTC");
        if (missing.length === 0) return;
        var app = document.getElementById("app");
        if (app) app.style.display = "none";
        var wrap = document.createElement("div");
        wrap.setAttribute("style", "font-family:sans-serif;background:#0b0d12;color:#e8eaf0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px");
        var card = document.createElement("div");
        card.setAttribute("style", "max-width:560px;line-height:1.6");
        var h = document.createElement("h1");
        h.setAttribute("style", "font-size:22px;margin:0 0 12px");
        h.textContent = "\uD83D\uDCE1 StreamCaster";
        var p1 = document.createElement("p");
        p1.setAttribute("style", "margin:0 0 16px");
        p1.textContent = "This browser is too old for the web receiver (missing: " + missing.join(", ") + ").";
        var p2 = document.createElement("p");
        p2.setAttribute("style", "margin:0 0 16px");
        p2.textContent = "On a Fire TV Stick, install the free receiver app instead \u2014 open this address in the \u201CDownloader\u201D app:";
        var b = document.createElement("b");
        b.setAttribute("style", "font-size:18px;word-break:break-all");
        b.textContent = (location.host || "streamcaster.pages.dev") + "/apk";
        var p3 = document.createElement("p");
        p3.setAttribute("style", "margin:0;color:#8ab4ff");
        p3.textContent = "Dieser Browser ist zu alt \u2014 bitte die App installieren.";
        card.appendChild(h);
        card.appendChild(p1);
        card.appendChild(p2);
        card.appendChild(b);
        card.appendChild(p3);
        wrap.appendChild(card);
        document.body.appendChild(wrap);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
