name: CI

# Quality gate: typecheck + unit tests + production build on every push/PR.
# (Deploy stays manual via `pnpm deploy:all` — see ACCESS.md. A separate
# deploy job can be added later with CLOUDFLARE_API_TOKEN as a repo secret.)
on:
  push:
    branches: [ main ]
  pull_request:

# Least privilege: this job only reads source. Without this block the default
# GITHUB_TOKEN may be granted write scopes, which a compromised dependency in
# `pnpm install` could use during the build.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck + unit tests + status check
        run: pnpm verify

      - name: Production build (sender + receiver + site)
        run: pnpm build:site
